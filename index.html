<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirante · mapa ao vivo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--panel:rgba(14,19,26,.92);--line:#223040;--ink:#e6edf3;--mute:#8b9bab;--cam:#3ddc97;--fly:#ffc857;--ship:#4cc9f0;--quake:#ff5d5d;--evt:#ff8c42;--osm:#c77dff;--pow:#f72585;--sat:#f1f5f9;--stl:#94a3b8;--cab:#2ec4b6;--apt:#e9c46a;--war:#e63946}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:#0b0f14}
.top{position:fixed;z-index:1000;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bar{display:flex;gap:8px;align-items:center;pointer-events:auto}
.brand{font:700 18px/1 'Space Grotesk',sans-serif;letter-spacing:-.01em;background:var(--panel);border:1px solid var(--line);padding:11px 13px;border-radius:12px;white-space:nowrap}
.brand b{color:var(--cam)}
form.search{flex:1;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
form.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:16px Inter,sans-serif;padding:10px 12px;outline:none}
button{font:600 14px Inter,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cam);outline-offset:1px}
form.search button{border:0;border-left:1px solid var(--line);border-radius:0}
.chips{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;font-size:13px;min-height:38px;opacity:.55}
.chip.on{opacity:1}
.chip svg{width:16px;height:16px;flex:none;color:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.chip small{color:var(--mute);font-weight:400}
.chip small.err{color:var(--quake)}
.sheet{position:fixed;z-index:1001;left:0;right:0;bottom:0;max-height:62vh;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(105%);transition:transform .25s;overflow:auto;backdrop-filter:blur(8px)}
.sheet.open{transform:none}
@media(min-width:760px){.sheet{left:auto;right:12px;bottom:12px;width:420px;border-radius:16px;border:1px solid var(--line);max-height:80vh}}
.sheet h2{font:700 18px/1.2 'Space Grotesk',sans-serif;margin:0 0 4px;padding-right:44px}
.sheet .meta{color:var(--mute);font-size:13px;margin-bottom:10px}
.sheet .x{position:absolute;top:10px;right:10px;width:40px;padding:0}
.shot{width:100%;border-radius:10px;background:#000;display:block;min-height:120px;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row a{color:var(--cam);font-weight:600;text-decoration:none;padding:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.grid figure{margin:0}.grid figcaption{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mute);font-size:14px}
.hint{position:fixed;z-index:999;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mute);white-space:nowrap;pointer-events:none;transition:opacity .3s}
.plane{color:var(--fly);transform-origin:center;filter:drop-shadow(0 0 2px #000)}.plane svg{width:24px;height:24px}
.cam{width:22px;height:22px;border-radius:6px;background:#0b0f14;border:1.5px solid var(--cam);display:grid;place-items:center;box-shadow:0 0 6px rgba(61,220,151,.6);position:relative}
.cam svg{width:14px;height:14px;color:var(--cam)}
.cam.v::after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#ff3b3b;border:1.5px solid #0b0f14}
.vidwrap{position:relative}.vidwrap video{width:100%;border-radius:10px;background:#000;display:block;max-height:50vh}
.live{display:inline-flex;align-items:center;gap:6px}.live::before{content:'';width:8px;height:8px;border-radius:50%;background:#ff3b3b}
.err{color:var(--quake);font-size:13px;margin-top:6px}
.marker-cluster{background:rgba(61,220,151,.22)!important;border-radius:50%}
.marker-cluster div{background:rgba(61,220,151,.9)!important;color:#06140e;font:700 12px Inter,sans-serif;border-radius:50%}
.leaflet-container{font:inherit;background:#0b0f14}
.leaflet-control-attribution{background:rgba(11,15,20,.7)!important;color:var(--mute)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--mute)!important}
.leaflet-control-zoom{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.stats div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stats span{display:block;color:var(--mute);font-size:12px}.stats b{font:600 15px Inter,sans-serif;white-space:nowrap}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;color:#0b0f14;margin-right:6px}
.wiki{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;margin:8px 0 4px}
.wiki img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:#000}
.wiki p{margin:0;font-size:14px;color:var(--ink)}.wiki small{color:var(--mute)}
.wiki.loading p{color:var(--mute)}
@media(max-width:380px){.wiki{grid-template-columns:1fr}.wiki img{width:100%;height:180px}}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="bar">
    <div class="brand">Mir<b>a</b>nte</div>
    <form class="search" id="search"><input id="q" placeholder="Buscar cidade ou local" autocomplete="off" aria-label="Buscar local"><button aria-label="Buscar">Ir</button></form>
    <button id="favbtn" aria-label="Câmeras favoritas">★</button>
    <button id="infobtn" aria-label="Fontes e créditos">ⓘ</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="hint" id="hint">Carregando…</div>
<section class="sheet" id="sheet" aria-live="polite"><button class="x" id="close" aria-label="Fechar">✕</button><div id="sheetBody"></div></section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@4.1.4/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NA = 'sem informação';
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

const view = store.get('mirante:view', {c:[-26.23,-52.67], z:5});
const map = L.map('map', {zoomControl:false, worldCopyJump:true, preferCanvas:true, renderer:L.canvas({padding:.5, tolerance:10})}).setView(view.c, view.z);
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19, maxNativeZoom:16,
  attribution:'Mapa © Esri, OpenStreetMap · dados: órgãos de trânsito, adsb.lol/airplanes.live/OpenSky, Digitraffic, USGS, NASA EONET'
}).addTo(map);
map.createPane('labels'); map.getPane('labels').style.zIndex = 350; map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, maxNativeZoom:16, pane:'labels'}).addTo(map);
map.on('moveend', () => store.set('mirante:view', {c:[map.getCenter().lat, map.getCenter().lng], z:map.getZoom()}));

/* Marcador em canvas com formatos diferentes (mantém o desempenho com milhares de pontos) */
const Shape = L.CircleMarker.extend({
  options:{shape:'circle', rot:0},
  _updatePath(){
    const r = this._renderer; if (!r._drawing || this._empty()) return;
    const ctx = r._ctx, {x, y} = this._point, s = Math.max(this._radius, 1), o = this.options;
    const poly = pts => { pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath(); };
    const rot = (dx, dy) => { const a = (o.rot || 0) * Math.PI / 180; return [x + dx * Math.cos(a) - dy * Math.sin(a), y + dx * Math.sin(a) + dy * Math.cos(a)]; };
    ctx.beginPath();
    switch (o.shape) {
      case 'square': ctx.rect(x - s, y - s, 2 * s, 2 * s); break;
      case 'diamond': poly([[x, y - s * 1.3], [x + s, y], [x, y + s * 1.3], [x - s, y]]); break;
      case 'hex': poly([...Array(6)].map((_, i) => [x + s * Math.cos(Math.PI / 3 * i), y + s * Math.sin(Math.PI / 3 * i)])); break;
      case 'tri': poly([rot(0, -s * 1.5), rot(s * .9, s), rot(0, s * .45), rot(-s * .9, s)]); break;
      case 'plus': { const w = s * .38; poly([[x - w, y - s], [x + w, y - s], [x + w, y - w], [x + s, y - w], [x + s, y + w], [x + w, y + w], [x + w, y + s], [x - w, y + s], [x - w, y + w], [x - s, y + w], [x - s, y - w], [x - w, y - w]]); break; }
      case 'sat': { const b = s * .45; ctx.rect(x - b, y - b, 2 * b, 2 * b); ctx.rect(x - s * 1.6, y - b * .7, s * 1.6 - b - 1.5, b * 1.4); ctx.rect(x + b + 1.5, y - b * .7, s * 1.6 - b - 1.5, b * 1.4); break; }
      default: ctx.arc(x, y, s, 0, Math.PI * 2);
    }
    r._fillStroke(ctx, this);
  }
});
const mk = (ll, opt) => new Shape(ll, opt);
const ICO = {
  cam:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 3a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>',
  fly:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>',
  ship:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l6 18-6-4-6 4z"/></svg>',
  quake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="8"/></svg>',
  evt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l8 11-8 11-8-11z"/></svg>',
  osm:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>',
  pow:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12l-4.5 7.8h-9L3 12l4.5-7.8h9z"/></svg>',
  sat:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="9" y="9" width="6" height="6"/><rect x="1" y="10" width="7" height="4"/><rect x="16" y="10" width="7" height="4"/></svg>',
  stl:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/></svg>',
  cab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 15c4-8 8 4 12-4s6 2 8 0"/></svg>',
  apt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>',
  war:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2h2v20H4zM7 3h13l-3 5 3 5H7z"/></svg>',
};
const CAM_SVG = ICO.cam;

const hint = $('#hint');
let hintT; const say = (t, ms=3500) => { hint.textContent = t; hint.style.opacity = 1; clearTimeout(hintT); if (ms) hintT = setTimeout(() => hint.style.opacity = 0, ms); };

/* ---------- painel inferior ---------- */
const sheet = $('#sheet'), body = $('#sheetBody');
let camTimer;
function openSheet(html){ stopVideo(); body.innerHTML = html; sheet.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); clearInterval(camTimer); stopVideo(); }
$('#close').onclick = closeSheet;
const bust = u => u + (u.includes('?') ? '&' : '?') + '_=' + Date.now();

let favs = store.get('mirante:favs', []);
let hls = null;
function stopVideo(){ if (hls) { hls.destroy(); hls = null; } const v = $('#vid'); if (v && v.tagName === 'VIDEO') { v.pause(); v.removeAttribute('src'); v.load(); } else if (v) v.remove(); }
function playVideo(url, box){
  stopVideo();
  if (url.startsWith('iframe:')) {
    box.innerHTML = `<iframe id="vid" src="${esc(url.slice(7))}" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000"></iframe>`;
    return;
  }
  box.innerHTML = '<video id="vid" playsinline muted autoplay controls></video>';
  const v = $('#vid'), fail = () => { stopVideo(); box.innerHTML = '<div class="err">O vídeo desta câmera não abriu agora. Mostrando a imagem.</div>'; };
  v.onerror = fail;
  if (/\.m3u8(\?|$)/i.test(url) && window.Hls && Hls.isSupported()) {
    hls = new Hls({maxBufferLength:10});
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) fail(); });
    hls.loadSource(url); hls.attachMedia(v);
  } else v.src = url;
  v.play().catch(() => {});
}
function showCam(c){
  stopVideo();
  const [lat, lon, name, img, src, video] = c;
  const key = img || video, isFav = favs.some(f => (f[3] || f[5]) === key);
  openSheet(`<h2>${esc(name)}</h2><div class="meta">${esc(src)} · ${lat.toFixed(4)}, ${lon.toFixed(4)}${video ? '' : ' · imagem atualiza a cada 15 s'}</div>
    <div class="vidwrap" id="vbox"></div>
    ${img ? `<img class="shot" id="shot" referrerpolicy="no-referrer" alt="Imagem da câmera ${esc(name)}" src="${esc(bust(img))}">` : ''}
    <div class="row">${video && img ? '<button id="play" class="live">Ver ao vivo</button>' : ''}<button id="fav">${isFav ? '★ Remover dos favoritos' : '☆ Favoritar'}</button>
    ${img ? `<a href="${esc(img)}" target="_blank" rel="noopener">Abrir imagem</a>` : ''}</div>`);
  const shot = $('#shot') || {style:{}, isConnected:false}, vbox = $('#vbox');
  shot.onerror = () => { shot.alt = 'Imagem indisponível agora'; };
  clearInterval(camTimer); if (img) camTimer = setInterval(() => { if (shot.isConnected && shot.style.display !== 'none') shot.src = bust(img); }, 15000);
  if (!img && video) { playVideo(video, vbox); }
  if (video && img) $('#play').onclick = () => {
    const on = !$('#vid');
    if (on) { shot.style.display = 'none'; playVideo(video, vbox); $('#play').textContent = 'Voltar à imagem'; }
    else { stopVideo(); vbox.innerHTML = ''; shot.style.display = ''; $('#play').textContent = 'Ver ao vivo'; }
    const obs = new MutationObserver(() => { if (vbox.querySelector('.err')) { shot.style.display = ''; $('#play')?.remove(); obs.disconnect(); } });
    obs.observe(vbox, {childList:true});
  };
  $('#fav').onclick = () => {
    favs = isFav ? favs.filter(f => (f[3] || f[5]) !== key) : [...favs, c];
    store.set('mirante:favs', favs); showCam(c);
  };
}
function showFavs(){
  clearInterval(camTimer);
  if (!favs.length) return openSheet('<h2>Favoritas</h2><p class="empty">Toque numa câmera e use ☆ Favoritar para vê-las todas juntas aqui.</p>');
  openSheet(`<h2>Favoritas</h2><div class="meta">${favs.length} câmeras · atualiza a cada 20 s</div><div class="grid">${
    favs.map((f,i) => `<figure>${f[3] ? `<img class="shot" data-i="${i}" referrerpolicy="no-referrer" alt="${esc(f[2])}" src="${esc(bust(f[3]))}">` : `<button class="shot" data-i="${i}" style="width:100%">▶ Vídeo ao vivo</button>`}<figcaption>${esc(f[2])}</figcaption></figure>`).join('')}</div>`);
  body.querySelectorAll('[data-i]').forEach(im => im.onclick = () => { const f = favs[im.dataset.i]; map.setView([f[0], f[1]], 14); showCam(f); });
  camTimer = setInterval(() => body.querySelectorAll('img[data-i]').forEach(im => im.src = bust(favs[im.dataset.i][3])), 20000);
}
$('#favbtn').onclick = showFavs;

/* ---------- camadas ---------- */
const LAYERS = [
  {id:'cam',   name:'Câmeras',     c:'var(--cam)',   on:true},
  {id:'fly',   name:'Voos',        c:'var(--fly)',   on:true},
  {id:'ship',  name:'Navios',      c:'var(--ship)',  on:false},
  {id:'quake', name:'Terremotos',  c:'var(--quake)', on:true},
  {id:'evt',   name:'Eventos',     c:'var(--evt)',   on:true},
  {id:'osm',   name:'Câmeras OSM', c:'var(--osm)',   on:false},
  {id:'pow',   name:'Usinas',      c:'var(--pow)',   on:false},
  {id:'sat',   name:'Satélites',   c:'var(--sat)',   on:true},
  {id:'stl',   name:'Starlink',    c:'var(--stl)',   on:false},
  {id:'cab',   name:'Cabos submarinos', c:'var(--cab)', on:false},
  {id:'apt',   name:'Aeroportos',  c:'var(--apt)',   on:false},
  {id:'war',   name:'Frente Ucrânia', c:'var(--war)', on:false},
];
const state = store.get('mirante:layers', {});
LAYERS.forEach(l => { if (l.id in state) l.on = state[l.id]; l.group = l.id === 'cam'
  ? L.markerClusterGroup({chunkedLoading:true, maxClusterRadius:50, showCoverageOnHover:false})
  : L.layerGroup(); });
const byId = Object.fromEntries(LAYERS.map(l => [l.id, l]));

$('#chips').innerHTML = LAYERS.map(l => `<button class="chip" id="chip-${l.id}" style="--c:${l.c}" aria-pressed="false">${ICO[l.id] || ''}${l.name} <small id="st-${l.id}"></small></button>`).join('');
function setStatus(id, txt, err){ const s = $('#st-' + id); s.textContent = txt; s.className = err ? 'err' : ''; }
function paint(l){ const b = $('#chip-' + l.id); b.classList.toggle('on', l.on); b.setAttribute('aria-pressed', l.on); }
LAYERS.forEach(l => {
  paint(l);
  if (l.on) l.group.addTo(map);
  $('#chip-' + l.id).onclick = () => {
    l.on = !l.on; paint(l);
    l.on ? (l.group.addTo(map), refresh(l)) : map.removeLayer(l.group);
    state[l.id] = l.on; store.set('mirante:layers', state);
  };
});

async function getJSON(url, opts){ const r = await fetch(url, opts); if (!r.ok) throw new Error(r.status); return r.json(); }
const fmt = n => n.toLocaleString('pt-BR');

/* Câmeras (lista gerada pela GitHub Action) */
let camsLoaded = false;
async function loadCams(){
  const l = byId.cam; setStatus('cam', '…');
  try {
    const cams = await getJSON('data/cameras.json', {cache:'no-cache'});
    if (!cams.length) { setStatus('cam', 'aguardando Action', true); return; }
    const icon = L.divIcon({className:'', html:`<div class="cam">${CAM_SVG}</div>`, iconSize:[22,22]});
    const iconV = L.divIcon({className:'', html:`<div class="cam v">${CAM_SVG}</div>`, iconSize:[22,22]});
    l.group.addLayers(cams.map(c => L.marker([c[0], c[1]], {icon:c[5] ? iconV : icon, title:c[2]}).on('click', () => showCam(c))));
    const nv = cams.filter(c => c[5]).length;
    camsLoaded = true; setStatus('cam', `${fmt(cams.length)} · ${fmt(nv)} com vídeo`);
  } catch(e){ setStatus('cam', 'erro', true); }
}

/* Voos. adsb.lol e airplanes.live não liberam CORS: passam pelo proxy (worker/flights-proxy.js) se PROXY estiver preenchido. */
const PROXY = '';
/* Na Vercel existe /api/flights no mesmo domínio; no GitHub Pages não. Testa uma vez. */
let hasApi = false;
const apiCheck = fetch('api/flights?url=' + encodeURIComponent('https://api.airplanes.live/v2/point/0/0/1'))
  .then(r => { hasApi = r.ok && (r.headers.get('content-type') || '').includes('json'); }).catch(() => {});
const clampLon = x => Math.max(-180, Math.min(180, x)), clampLat = x => Math.max(-90, Math.min(90, x));
async function loadFlights(){
  await apiCheck;
  const l = byId.fly;
  if (map.getZoom() < 6) { l.group.clearLayers(); setStatus('fly', 'aproxime o mapa'); return; }
  const b = map.getBounds(), c = b.getCenter();
  const lat = c.lat, lon = ((c.lng + 540) % 360) - 180;
  const radius = Math.max(10, Math.min(250, Math.ceil(c.distanceTo(b.getNorthEast()) / 1852)));
  const via = u => (PROXY || hasApi) ? `${PROXY || 'api/flights'}?url=${encodeURIComponent(u)}` : u;
  const readsb = url => getJSON(via(url)).then(d => (d.ac || d.aircraft || []).map(a => ({id:a.hex, cs:(a.flight||a.hex||'').trim(), lat:a.lat, lon:a.lon, alt:a.alt_baro, spd:a.gs, trk:a.track ?? a.true_heading ?? 0, type:a.t, reg:a.r})));
  const w = clampLon(b.getWest()), e = clampLon(b.getEast());
  const opensky = () => getJSON(`https://opensky-network.org/api/states/all?lamin=${clampLat(b.getSouth()).toFixed(3)}&lomin=${(w < e ? w : -180).toFixed(3)}&lamax=${clampLat(b.getNorth()).toFixed(3)}&lomax=${(w < e ? e : 180).toFixed(3)}`)
    .then(d => (d.states || []).map(s => ({id:s[0], cs:(s[1]||s[0]).trim(), lat:s[6], lon:s[5], alt:s[7] != null ? Math.round(s[7]*3.281) : null, spd:s[9] != null ? Math.round(s[9]*1.944) : null, trk:s[10] || 0, type:s[2]})));
  const chain = [
    ...((PROXY || hasApi) ? [['adsb.lol', () => readsb(`https://api.adsb.lol/v2/point/${lat.toFixed(3)}/${lon.toFixed(3)}/${radius}`)]] : []),
    ['airplanes.live', () => readsb(`https://api.airplanes.live/v2/point/${lat.toFixed(3)}/${lon.toFixed(3)}/${radius}`)],
    ['OpenSky', opensky],
  ];
  let list = null, used = '';
  for (const [name, fn] of chain) { try { list = await fn(); used = name; break; } catch(err){} }
  if (!list) { setStatus('fly', (PROXY || hasApi) ? 'fontes indisponíveis' : 'precisa do proxy', true); return; }
  l.group.clearLayers();
  list.filter(a => a.lat != null && a.lon != null).forEach(a => {
    const icon = L.divIcon({className:'', iconSize:[24,24], html:`<div class="plane" style="transform:rotate(${a.trk}deg);width:24px;height:24px">${ICO.fly}</div>`});
    L.marker([a.lat, a.lon], {icon}).bindPopup(`<b>${esc(a.cs || a.id)}</b><br>Modelo: ${a.type ? esc(a.type) : NA}<br>Registro: ${a.reg ? esc(a.reg) : NA}<br>Altitude: ${a.alt === 'ground' ? 'no solo' : a.alt != null ? fmt(a.alt) + ' ft' : NA}<br>Velocidade: ${a.spd != null ? Math.round(a.spd) + ' kt' : NA}<br><a href="https://globe.adsbexchange.com/?icao=${esc(a.id)}" target="_blank" rel="noopener">Ver no ADS-B Exchange</a>`).addTo(l.group);
  });
  setStatus('fly', `${fmt(list.length)} · ${used}`);
}

/* OpenStreetMap via Overpass: câmeras mapeadas pela comunidade e usinas */
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
let ovIdx = 0, ovQueue = Promise.resolve();
const ovLast = {};
async function overpassFetch(q){
  let lastErr;
  for (let i = 0; i < OVERPASS.length; i++) {
    const url = OVERPASS[(ovIdx + i) % OVERPASS.length];
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
      const r = await fetch(url, {method:'POST', body:'data=' + encodeURIComponent(q), signal:ctl.signal}); clearTimeout(t);
      if (!r.ok) throw new Error(r.status);
      ovIdx = (ovIdx + i) % OVERPASS.length; return await r.json();
    } catch(e){ lastErr = e; }
  }
  throw lastErr;
}
function overpass(id, query, minZoom, draw){
  const l = byId[id];
  if (map.getZoom() < minZoom) { l.group.clearLayers(); ovLast[id] = null; setStatus(id, 'aproxime o mapa'); return; }
  const view = map.getBounds();
  if (ovLast[id] && ovLast[id].contains(view)) return;          // já temos essa área
  const b = view.pad(0.3), bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(n => n.toFixed(4)).join(',');
  setStatus(id, '…');
  ovQueue = ovQueue.then(async () => {                            // uma consulta por vez, para não ser bloqueado
    try {
      const d = await overpassFetch(`[out:json][timeout:25];${query.replaceAll('BBOX', bbox)}`);
      l.group.clearLayers(); ovLast[id] = b;
      d.elements.forEach(el => { const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon; if (lat != null) draw(el, lat, lon).addTo(l.group); });
      setStatus(id, fmt(d.elements.length));
    } catch(e){ setStatus(id, 'servidores OSM ocupados, tente de novo', true); }
  });
}
const loadOsm = () => overpass('osm', 'node["man_made"="surveillance"](BBOX);out 4000;', 10, (el, lat, lon) =>

let sats = null, satTick, satSel = null, satLayers = [];
async function loadSats(){
  if (!sats) {
    try {
      const raw = await getJSON('data/satellites.json', {cache:'no-cache'});
      sats = raw.map(r => { try { return {name:r[0], l1:r[1], g:r[3], id:r[4], own:r[5], ld:r[6], site:r[7], type:r[8], rcs:r[9], rec:satellite.twoline2satrec(r[1], r[2]), m:null}; } catch(e){ return null; } }).filter(Boolean);

  }
  clearInterval(satTick); drawSats(); satTick = setInterval(() => { if (!document.hidden) drawSats(); }, 2000);

function satPos(rec, date){
  const pv = satellite.propagate(rec, date); if (!pv || !pv.position) return null;
  const geo = satellite.eciToGeodetic(pv.position, satellite.gstime(date));
  const v = pv.velocity ? Math.hypot(pv.velocity.x, pv.velocity.y, pv.velocity.z) : null;
  return {lat:satellite.degreesLat(geo.latitude), lon:satellite.degreesLong(geo.longitude), alt:geo.height, v};
}
function drawSats(){
  if (!sats) return;
  const now = new Date(), onSat = byId.sat.on, onStl = byId.stl.on; let ns = 0, nl = 0;
  for (const s of sats) {
    const isStl = s.g === 'starlink', layer = isStl ? byId.stl : byId.sat;
    if (!(isStl ? onStl : onSat)) { if (s.m) { layer.group.removeLayer(s.m); s.m = null; } continue; }
    const p = satPos(s.rec, now); if (!p || isNaN(p.lat)) continue;
    if (!s.m) {
      const big = s.g === 'stations', col = (SAT_G[s.g] || SAT_G.visual)[1];
      s.m = mk([p.lat, p.lon], {shape:isStl ? 'circle' : 'sat', radius:big ? 9 : isStl ? 3.5 : 6.5, weight:isStl ? 1 : 1.5, color:'#0b0f14', fillColor:col, fillOpacity:1})
        .on('click', () => showSat(s)).addTo(layer.group);
    } else s.m.setLatLng([p.lat, p.lon]);
    s.p = p; isStl ? nl++ : ns++;
  }
  if (satSel && satSel.p) satLayers[0]?.setLatLng([satSel.p.lat, satSel.p.lon]);
  setStatus('sat', fmt(ns)); setStatus('stl', onStl ? fmt(nl) : '');
}
function clearSel(){ satLayers.forEach(l => map.removeLayer(l)); satLayers = []; satSel = null; }
const R_EARTH = 6378.137, MU = 398600.4418;
function launchYear(s){
  if (s.ld) return +s.ld.slice(0, 4);
  const yy = +s.l1.slice(9, 11); return isNaN(yy) ? null : (yy < 57 ? 2000 : 1900) + yy;
}
/* Foto e resumo pela Wikipédia (busca em inglês, texto em português quando existir) */
const WIKI_ALIAS = [[/^ISS\b/, 'International Space Station'], [/^(CSS|TIANHE|TIANGONG|WENTIAN|MENGTIAN)/, 'Tiangong space station'],
  [/^HST$/, 'Hubble Space Telescope'], [/^CXO$/, 'Chandra X-ray Observatory'], [/^SWIFT$/, 'Neil Gehrels Swift Observatory'], [/^NUSTAR/, 'NuSTAR'], [/^TESS$/, 'Transiting Exoplanet Survey Satellite'], [/^FERMI/, 'Fermi Gamma-ray Space Telescope'], [/^STARLINK/, 'Starlink'], [/^GPS B(I+[A-Z]*|III)/, 'GPS satellite blocks'],
  [/^NAVSTAR/, 'GPS satellite blocks'], [/^ONEWEB/, 'OneWeb satellite constellation'], [/^IRIDIUM/, 'Iridium satellite constellation'],
  [/^GLOBALSTAR/, 'Globalstar'], [/^ORBCOMM/, 'Orbcomm'], [/^SOYUZ-MS/, 'Soyuz MS'], [/^PROGRESS-MS/, 'Progress MS'],
  [/^CREW DRAGON|^DRAGON/, 'SpaceX Dragon 2'], [/^TIANZHOU/, 'Tianzhou (spacecraft)'], [/^SHENZHOU/, 'Shenzhou (spacecraft)']];
const wikiCache = new Map();
function wikiQuery(name){
  const n = name.toUpperCase().trim();
  for (const [re, t] of WIKI_ALIAS) if (re.test(n)) return {title:t};
  let q = name.replace(/\(.*?\)/g, ' ').replace(/\bDEB\b.*$/i, ' ').trim();
  if (/R\/B/i.test(q)) q = q.replace(/R\/B/i, '') + ' rocket stage';
  else q = q + ' satellite';
  return {search:q.replace(/\s+/g, ' ').trim()};
}
async function wikiFor(name){
  if (wikiCache.has(name)) return wikiCache.get(name);
  const job = (async () => {
    const q = wikiQuery(name);
    const base = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|extracts|langlinks&piprop=thumbnail&pithumbsize=400&exintro=1&explaintext=1&exsentences=2&lllang=pt';
    const url = q.title ? `${base}&titles=${encodeURIComponent(q.title)}` : `${base}&generator=search&gsrlimit=1&gsrsearch=${encodeURIComponent(q.search)}`;
    const d = await getJSON(url);
    const page = Object.values(d.query?.pages || {})[0];
    if (!page || page.missing !== undefined) return null;
    if (!q.title && !wikiMatches(name, page.title)) return null; // busca sem correspondência clara: não mostra nada
    let res = {title:page.title, text:page.extract, img:page.thumbnail?.source, url:'https://en.wikipedia.org/wiki/' + encodeURIComponent(page.title.replace(/ /g, '_'))};
    const pt = page.langlinks?.[0]?.['*'];
    if (pt) try {
      const s = await getJSON('https://pt.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(pt.replace(/ /g, '_')));
      res = {title:s.title, text:s.extract || res.text, img:s.thumbnail?.source || res.img, url:s.content_urls?.mobile?.page || res.url};
    } catch(e){}
    return res;
  })().catch(() => null);
  wikiCache.set(name, job); return job;
}
/* aceita o artigo só se o título contém a parte principal do nome do satélite (ex.: "NOAA 19" ↔ "NOAA-19") */
function wikiMatches(name, title){
  const norm = t => t.toUpperCase().replace(/\(.*?\)/g, ' ').replace(/[^A-Z0-9]+/g, ' ').trim();
  const n = norm(name).split(' ').filter(Boolean), t = ' ' + norm(title).replace(/ /g, '') + ' ';
  if (!n.length) return false;
  const core = n.slice(0, Math.min(2, n.length)).join('');
  return core.length >= 3 && t.includes(core);
}
function trimText(t, max = 260){ if (!t) return ''; if (t.length <= max) return t; const c = t.slice(0, max); return c.slice(0, c.lastIndexOf(' ')) + '…'; }

function showSat(s){
  clearInterval(camTimer); stopVideo(); clearSel(); satSel = s;
  const rec = s.rec, period = 2 * Math.PI / rec.no; // minutos
  const a = Math.cbrt(MU / Math.pow(rec.no / 60, 2)), apo = a * (1 + rec.ecco) - R_EARTH, peri = a * (1 - rec.ecco) - R_EARTH;
  const incl = rec.inclo * 180 / Math.PI;
  const pts = [], t0 = Date.now();
  for (let m = -period / 2; m <= period / 2; m += period / 160) { const p = satPos(rec, new Date(t0 + m * 60000)); if (p) pts.push([p.lat, p.lon]); }
  const segs = [[]]; pts.forEach((p, i) => { if (i && Math.abs(p[1] - pts[i-1][1]) > 180) segs.push([]); segs[segs.length - 1].push(p); });
  const p0 = s.p || satPos(rec, new Date());
  satLayers = [
    L.circleMarker([p0.lat, p0.lon], {radius:16, color:'#ffd166', weight:2, fill:false, interactive:false}),
    L.polyline(segs, {color:'#ffd166', weight:2, dashArray:'5 5', opacity:.85, interactive:false}),
  ];
  const cover = L.circle([p0.lat, p0.lon], {radius:R_EARTH * 1000 * Math.acos(R_EARTH / (R_EARTH + p0.alt)), color:'#ffd166', weight:1, fillOpacity:.06, interactive:false});
  satLayers.push(cover); satLayers.forEach(l => l.addTo(map));
  const [cat, col] = SAT_G[s.g] || ['Outro', '#fff'];
  const yr = launchYear(s), age = yr ? new Date().getFullYear() - yr : null;
  const orbit = a - R_EARTH > 30000 ? (incl < 5 && rec.ecco < .05 ? 'Geoestacionária (GEO)' : 'Geossíncrona/alta') : peri < 2000 && apo > 10000 ? 'Altamente elíptica (HEO)' : a - R_EARTH > 2000 ? 'Média (MEO)' : 'Baixa (LEO)';
  const stat = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
  const statsHtml = p => `
        ${stat('Velocidade', p.v ? fmt(Math.round(p.v * 3600)) + ' km/h' : NA)}
        ${stat('Altitude', fmt(Math.round(p.alt)) + ' km')}
        ${stat('País/operador', esc(OWNER[s.own] || s.own || NA))}
        ${stat('Lançamento', s.ld ? new Date(s.ld + 'T12:00').toLocaleDateString('pt-BR') : yr ? 'ano ' + yr : NA)}
        ${stat('Em órbita há', age != null ? (age < 1 ? 'menos de 1 ano' : age + (age === 1 ? ' ano' : ' anos')) : NA)}
        ${stat('Local de lançamento', esc(SITE[s.site] || s.site || NA))}
        ${stat('Tipo de órbita', orbit)}
        ${stat('Volta na Terra', period < 120 ? Math.round(period) + ' min' : (period / 60).toFixed(1) + ' h')}
        ${stat('Voltas por dia', (1440 / period).toFixed(1))}
        ${stat('Inclinação', incl.toFixed(1) + '°')}
        ${stat('Apogeu / perigeu', fmt(Math.round(apo)) + ' / ' + fmt(Math.round(peri)) + ' km')}
        ${stat('Posição', p.lat.toFixed(2) + ', ' + p.lon.toFixed(2))}
        ${stat('NORAD', rec.satnum)}
        ${stat('Designação', esc(s.id || s.l1.slice(9, 17).trim() || NA))}`;
  const pNow = s.p || satPos(rec, new Date());
  body.innerHTML = `<h2>${esc(s.name)}</h2>
      <div class="meta"><span class="tag" style="background:${col}">${esc(cat)}</span>${esc(s.type ? (TYPE[s.type] || s.type) : 'tipo de objeto: ' + NA)}</div>
      <div class="wiki loading" id="wiki"><p>Buscando foto e descrição…</p></div>
      <div class="stats" id="satStats">${statsHtml(pNow)}</div>
      <div class="meta">Linha tracejada: uma volta completa. Círculo: área de onde ele está visível agora.</div>
      <div class="row"><a href="https://www.n2yo.com/satellite/?s=${rec.satnum}" target="_blank" rel="noopener">Passagens sobre você (N2YO)</a> <a href="https://celestrak.org/satcat/table-satcat.php?CATNR=${rec.satnum}" target="_blank" rel="noopener">Catálogo</a></div>`;
  wikiFor(s.name).then(w => {
    const box = $('#wiki'); if (!box || satSel !== s) return;
    if (!w || (!w.img && !w.text)) { box.className = 'wiki'; box.innerHTML = '<p style="grid-column:1/-1;color:var(--mute)">Foto e descrição: sem informação na Wikipédia.</p>'; return; }
    box.className = 'wiki';
    box.innerHTML = `${w.img ? `<img src="${esc(w.img)}" alt="${esc(w.title)}" loading="lazy">` : ''}<div style="${w.img ? '' : 'grid-column:1/-1'}"><p>${esc(trimText(w.text))}</p>
      <small>Wikipédia: <a href="${esc(w.url)}" target="_blank" rel="noopener" style="color:var(--cam)">${esc(w.title)}</a></small></div>`;
    const im = box.querySelector('img'); if (im) im.onerror = () => im.remove();
  });
  const render = () => {
    const p = s.p || satPos(rec, new Date()); if (!p) return;
    cover.setLatLng([p.lat, p.lon]).setRadius(R_EARTH * 1000 * Math.acos(R_EARTH / (R_EARTH + p.alt)));
    const box = $('#satStats'); if (box) box.innerHTML = statsHtml(p);
  };
  sheet.classList.add('open'); camTimer = setInterval(render, 2000);
  if (map.getZoom() > 4) map.panTo([p0.lat, p0.lon]);
}
$('#close').addEventListener('click', clearSel);

/* Cabos submarinos (TeleGeography), aeroportos (OurAirports), frente na Ucrânia (DeepStateMap) */
const once = {};
async function staticLayer(id, file, draw){
  if (once[id]) return; once[id] = true; setStatus(id, '…');
  try { const d = await getJSON('data/' + file, {cache:'no-cache'}); setStatus(id, draw(d, byId[id].group)); }
  catch(e){ once[id] = false; setStatus(id, 'aguardando Action', true); }
}
const loadCab = () => staticLayer('cab', 'cables.json', (d, g) => {
  L.geoJSON(d, {style:f => ({color:f.properties.c || '#2ec4b6', weight:1.5, opacity:.75}),
    onEachFeature:(f, ly) => ly.bindPopup(`<b>${esc(f.properties.n)}</b><br><a href="https://www.submarinecablemap.com/" target="_blank" rel="noopener">Submarine Cable Map</a>`)}).addTo(g);
  return fmt(d.features.length); });
const loadApt = () => { aptZoom(); return staticLayer('apt', 'airports.json', (d, g) => {
  d.forEach(a => mk([a[0], a[1]], {shape:'plus', radius:a[6] === 'G' ? 8 : 6, weight:1, color:'#0b0f14', fillColor:'#e9c46a', fillOpacity:.95})
    .bindPopup(`<b>${esc(a[2])}</b>${a[3] ? ' (' + esc(a[3]) + ')' : ''}<br>Cidade: ${esc(a[4] || NA)} · País: ${esc(a[5] || NA)}<br>${a[6] === 'G' ? 'Grande porte' : 'Médio porte'}`).addTo(g));
  setTimeout(aptZoom); return fmt(d.length); }); };
/* aeroportos só a partir do zoom 4, para não cobrir o mapa-múndi */
function aptZoom(){ const l = byId.apt; if (!l.on) return; const show = map.getZoom() >= 4;
  if (show && !map.hasLayer(l.group)) l.group.addTo(map); if (!show && map.hasLayer(l.group)) map.removeLayer(l.group);
  if (once.apt) setStatus('apt', show ? (l.group.getLayers().length ? fmt(l.group.getLayers().length) : '…') : 'aproxime o mapa'); }
map.on('zoomend', aptZoom);
const loadWar = () => staticLayer('war', 'frontline.json', (d, g) => {
  L.geoJSON(d, {style:{color:'#e63946', weight:1, fillColor:'#e63946', fillOpacity:.25},
    onEachFeature:(f, ly) => ly.bindPopup(`<b>Área ocupada</b>${f.properties.n ? '<br>' + esc(f.properties.n) : ''}<br><small>DeepStateMap${d.updated ? ' · ' + esc(String(d.updated).slice(0, 10)) : ''}</small>`)}).addTo(g);
  return d.updated ? String(d.updated).slice(0, 10) : fmt(d.features.length); });

/* Créditos */
$('#infobtn').onclick = () => { clearInterval(camTimer); openSheet(`<h2>Fontes</h2><div class="meta">Dados públicos e gratuitos, usados para fins não comerciais.</div>
  <p style="font-size:14px">Câmeras: OpenCCTV (catálogo) · ANTT (dados abertos) · Powered by TfL Open Data · Digitraffic/Fintraffic (CC BY 4.0) · NYC DOT · Caltrans · DriveBC · NZTA · Iowa DOT · Road511 (20 estados dos EUA)<br>
  Voos: airplanes.live · adsb.lol · OpenSky Network<br>Navios: Digitraffic (CC BY 4.0)<br>Satélites: CelesTrak · Terremotos: USGS · Eventos: NASA EONET<br>
  Cabos: TeleGeography Submarine Cable Map · Aeroportos: OurAirports · Frente: DeepStateMap<br>Mapa: Esri, OpenStreetMap · Busca e camadas OSM: Nominatim, Overpass</p>`); };

const LOADERS = {cam:() => camsLoaded || loadCams(), fly:loadFlights, ship:loadShips, quake:loadQuakes, evt:loadEvents, osm:loadOsm, pow:loadPow, sat:loadSats, stl:loadSats, cab:loadCab, apt:loadApt, war:loadWar};
function refresh(l){ if (l.on) LOADERS[l.id](); }

/* atualização: voos a cada 15 s, navios a cada 60 s; ao mover o mapa recarrega o que depende da área */
let moveT;
map.on('moveend', () => { clearTimeout(moveT); moveT = setTimeout(() => ['fly','ship','osm','pow'].forEach(id => refresh(byId[id])), 600); });
setInterval(() => { if (!document.hidden) refresh(byId.fly); }, 15000);
setInterval(() => { if (!document.hidden) refresh(byId.ship); }, 60000);
setInterval(() => { if (!document.hidden) { refresh(byId.quake); refresh(byId.evt); } }, 600000);

/* busca de local (Nominatim) */
$('#search').onsubmit = async e => {
  e.preventDefault(); const q = $('#q').value.trim(); if (!q) return;
  try {
    const r = await getJSON('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    if (!r.length) return say('Local não encontrado');
    const bb = r[0].boundingbox.map(Number);
    map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], {maxZoom:13}); $('#q').blur();
  } catch(err){ say('Busca indisponível agora'); }
};

LAYERS.forEach(refresh);
say('Toque nos botões para ligar ou desligar camadas', 5000);
}
</script>
