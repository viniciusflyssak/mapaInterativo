name: Atualizar câmeras

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/cameras.yml"

permissions:
  contents: write

concurrency:
  group: cameras
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_cameras.py
      - name: Commit
        run: |
          git config user.name "mirante-bot"
          git config user.email "mirante-bot@users.noreply.github.com"
          git add data/cameras.json
          git diff --cached --quiet || (git commit -m "Atualiza lista de câmeras" && git push)
